<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<title>InLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   InLog — folha de estilos única
   1. Tokens  2. Base  3. Header  4. Layout  5. Componentes
   6. Autenticação  7. Perfil  8. Responsivo
   ========================================================== */

/* 1. TOKENS — altera aqui as cores e o "feeling" da app */
:root {
  --bg: #0d0f14;          /* fundo da página */
  --surface: #151822;     /* cartões */
  --surface-2: #1d2130;   /* campos, hover */
  --line: #262b3b;        /* bordas */
  --text: #eceef5;
  --muted: #8a92a8;
  --accent: #8b7bff;      /* cor de destaque (violeta-íris) */
  --accent-2: #5ee0c1;    /* destaque secundário (menta) */
  --danger: #ff6b81;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* 2. BASE */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
.muted { color: var(--muted); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); cursor: pointer; font-weight: 600; transition: transform .2s var(--ease), background .2s, border-color .2s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #12102a; }
.btn-primary:hover { background: #9d8fff; }
.btn-block { width: 100%; padding: 12px; }

/* Avatar: iniciais sobre gradiente (trocar por <img> quando houver fotos) */
.avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #12102a; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.avatar.lg { width: 96px; height: 96px; font-size: 32px; border: 4px solid var(--bg); }

/* 3. HEADER */
.header { position: sticky; top: 0; z-index: 20; background: rgba(13, 15, 20, .85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.header-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: -.04em; }
.logo svg { width: 28px; height: 28px; }
.nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nav a:not(.btn) { padding: 8px 14px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
.nav a:not(.btn):hover, .nav a.active { color: var(--text); background: var(--surface-2); }
.burger { display: none; margin-left: auto; background: none; border: 0; padding: 8px; cursor: pointer; }
.burger span { display: block; width: 22px; height: 2px; margin: 5px 0; background: var(--text); border-radius: 2px; transition: transform .25s var(--ease), opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* 4. LAYOUT (3 colunas no desktop, 1 no telemóvel) */
.layout { max-width: 1080px; margin: 0 auto; padding: 20px 16px 90px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
.side { position: sticky; top: 76px; display: grid; gap: 16px; }
.feed { display: grid; gap: 14px; }

/* 5. COMPONENTES */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.user-card { text-align: center; }
.user-card .avatar { margin: 0 auto 10px; width: 64px; height: 64px; font-size: 22px; }
.stats { display: flex; justify-content: space-around; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.stats b { display: block; font-size: 18px; }
.stats span { font-size: 12px; color: var(--muted); }

.composer { display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer; text-align: left; color: var(--muted); transition: border-color .2s; }
.composer:hover { border-color: var(--accent); }

/* Publicação */
.post { display: flex; gap: 12px; position: relative; animation: enter .35s var(--ease) both; }
.post-body { min-width: 0; flex: 1; }
.post-head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.post-head b { font-weight: 700; }
.post-text { margin: 4px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: 6px; margin-left: -8px; }
.act { background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--muted); cursor: pointer; transition: color .2s, background .2s, transform .2s var(--ease); }
.act:hover { background: var(--surface-2); color: var(--text); }
.act.liked { color: var(--danger); }
.act.liked .heart { animation: pop .3s var(--ease); display: inline-block; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 50% { transform: scale(1.4); } }

.list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.list-item .avatar { width: 36px; height: 36px; font-size: 13px; }
.list-item .btn { margin-left: auto; padding: 5px 12px; font-size: 13px; }
.card h3 { font-size: 15px; margin-bottom: 6px; }

/* Botão flutuante (só telemóvel) */
.fab { display: none; position: fixed; right: 18px; bottom: 18px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #12102a; font-size: 28px; cursor: pointer; box-shadow: 0 8px 24px rgba(139, 123, 255, .4); transition: transform .2s var(--ease); }
.fab:active { transform: scale(.92); }

/* Diálogo (criar publicação / editar perfil) */
dialog { width: min(520px, calc(100% - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
dialog::backdrop { background: rgba(5, 6, 10, .7); backdrop-filter: blur(3px); }
dialog[open] { animation: enter .25s var(--ease); }
dialog h2 { font-size: 18px; margin-bottom: 14px; }
.dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; }
.counter { margin-right: auto; font-size: 13px; color: var(--muted); }

/* Formulários */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.input { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color .2s, box-shadow .2s; }
.input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 123, 255, .2); }
textarea.input { resize: vertical; min-height: 110px; }
.error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

/* Aviso temporário */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 16px; width: max-content; max-width: 90vw; text-align: center; font-weight: 600; opacity: 0; pointer-events: none; transition: .3s var(--ease); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 6. AUTENTICAÇÃO */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(600px 300px at 50% 0, rgba(139, 123, 255, .16), transparent); }
.auth-card { width: min(400px, 100%); padding: 28px; animation: enter .4s var(--ease) both; }
.auth-card .logo { justify-content: center; margin-bottom: 6px; }
.auth-card h1 { font-size: 20px; text-align: center; }
.auth-card .sub { text-align: center; margin: 4px 0 22px; }
.auth-foot { text-align: center; margin: 18px 0 0; color: var(--muted); }
.auth-foot a { color: var(--accent); font-weight: 700; }

/* 7. PERFIL */
.profile { max-width: 680px; margin: 0 auto; padding: 0 16px 90px; }
.cover { height: 150px; margin-top: 16px; border-radius: var(--r-lg); background: linear-gradient(120deg, #26215a, #14303a); }
.profile-head { display: flex; align-items: flex-end; justify-content: space-between; margin: -48px 16px 0; }
.profile-info { padding: 12px 16px 0; }
.profile-info h1 { font-size: 24px; }
.profile-stats { display: flex; gap: 22px; margin: 14px 0 22px; }
.profile-stats b { font-size: 17px; }

/* 8. RESPONSIVO */
@media (max-width: 960px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } .side-right { display: none; } }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; padding-top: 14px; }
  .side-left { position: static; }
  .burger { display: block; }
  .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; padding: 12px 16px 16px; background: var(--surface); border-bottom: 1px solid var(--line); margin: 0; }
  .nav.open { display: flex; animation: enter .25s var(--ease); }
  .nav .btn { margin-top: 6px; }
  .fab { display: block; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Extras da versão com Supabase */
.avatar { overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.hidden { display: none !important; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.banner { background: var(--surface-2); border: 1px dashed var(--accent); border-radius: var(--r-md); padding: 8px 14px; font-size: 13px; color: var(--muted); text-align: center; }
body.auth-mode #app { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(600px 300px at 50% 0, rgba(139,123,255,.16), transparent); }
.profile-info p { margin: 8px 0 0; }
.post-text:empty { display: none; }
.post-img { display: block; width: 100%; max-height: 460px; object-fit: cover; border: 1px solid var(--line); border-radius: var(--r-md); margin: 4px 0 12px; background: var(--surface-2); }
.act.del { margin-left: auto; }
.act.del:hover { color: var(--danger); }
.add-img { margin-top: 12px; font-size: 14px; }
#img-preview { position: relative; margin-top: 12px; }
#img-preview img { width: 100%; max-height: 240px; object-fit: cover; border-radius: var(--r-md); }
#img-preview .btn { position: absolute; top: 8px; right: 8px; padding: 5px 12px; font-size: 13px; background: rgba(13,15,20,.85); }
.post.removing { opacity: 0; transform: scale(.98); transition: .25s var(--ease); }
.page { max-width: 680px; margin: 0 auto; padding: 20px 16px 90px; display: grid; gap: 14px; align-content: start; }
.ptitle { font-size: 22px; } .ptitle-row { display: flex; justify-content: space-between; align-items: center; }
.tabs { display: flex; gap: 6px; }
.list-item .grow { flex: 1; min-width: 0; } .list-item .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item.link .grow { cursor: pointer; }
.row-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row-actions .btn { margin-left: 0; padding: 6px 14px; font-size: 13px; }
.profile-stats { flex-wrap: wrap; }
.checks { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }
.check { display: flex; align-items: center; gap: 10px; padding: 6px 4px; cursor: pointer; }
.chat { max-width: 680px; margin: 0 auto; height: calc(100dvh - 62px); display: flex; flex-direction: column; padding: 0 16px; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chat-head .btn { padding: 6px 14px; } .chat-head b { flex: 1; font-size: 17px; }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 14px 0; }
.msg { max-width: 80%; padding: 8px 13px; border-radius: 16px; background: var(--surface-2); align-self: flex-start; overflow-wrap: anywhere; animation: enter .2s var(--ease) both; }
.msg.me { align-self: flex-end; background: var(--accent); color: #12102a; }
.msg small { display: block; font-size: 11px; color: var(--muted); }
.chat-form { display: flex; gap: 8px; padding: 12px 0 14px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Diálogo: nova publicação -->
<dialog id="composer-dialog"><form method="dialog">
  <h2>Nova publicação</h2>
  <textarea class="input" maxlength="280" placeholder="O que estás a pensar?"></textarea>
  <div id="img-preview" class="hidden"><img alt="Pré-visualização"><button type="button" class="btn" id="img-remove">Remover</button></div>
  <label class="btn add-img" for="p-image">📷 Adicionar imagem</label><input type="file" id="p-image" accept="image/*" class="hidden">
  <div class="dialog-actions">
    <span class="counter">0/280</span>
    <button class="btn" value="cancel" formnovalidate>Cancelar</button>
    <button class="btn btn-primary" value="ok">Publicar</button>
  </div>
</form></dialog>

<!-- Diálogo: editar perfil -->
<dialog id="edit-dialog"><form method="dialog">
  <h2>Editar perfil</h2>
  <div class="field" id="avatar-field"><label for="e-avatar">Foto de perfil</label><input class="input" id="e-avatar" type="file" accept="image/*"></div>
  <div class="field"><label for="e-name">Nome de apresentação</label><input class="input" id="e-name" maxlength="40"></div>
  <div class="field"><label for="e-bio">Biografia</label><textarea class="input" id="e-bio" maxlength="160"></textarea></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Guardar</button></div>
</form></dialog>

<!-- Diálogo: novo grupo -->
<dialog id="group-dialog"><form method="dialog">
  <h2>Novo grupo</h2>
  <div class="field"><label for="g-name">Nome do grupo</label><input class="input" id="g-name" maxlength="40"></div>
  <div class="field"><label>Membros (os teus amigos)</label><div id="g-members" class="checks"></div></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Criar</button></div>
</form></dialog>

<!-- Diálogo: nova comunidade -->
<dialog id="comm-dialog"><form method="dialog">
  <h2>Nova comunidade</h2>
  <div class="field"><label for="cm-name">Nome</label><input class="input" id="cm-name" maxlength="40"></div>
  <div class="field"><label for="cm-desc">Descrição</label><textarea class="input" id="cm-desc" maxlength="200" style="min-height:80px"></textarea></div>
  <div class="dialog-actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" value="ok">Criar</button></div>
</form></dialog>

<div class="toast" id="toast"></div>

<!-- Biblioteca do Supabase (versão fixa, via CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<!-- Plano B: se a biblioteca acima não carregar, usa uma versão mais antiga -->
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<script>
/* Se algo falhar ao carregar, mostra o erro no ecrã em vez de ficar tudo preto */
function showFatal(msg) {
  const app = document.getElementById("app");
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = '<main class="card auth-card"><h1>Erro ao carregar</h1><p class="sub muted" id="fatal"></p></main>';
    document.body.classList.add("auth-mode");
    document.getElementById("fatal").textContent = msg || "Erro desconhecido";
  }
}
window.addEventListener("error", (e) => showFatal(e.message));
window.addEventListener("unhandledrejection", (e) => showFatal(e.reason && e.reason.message));

/* ==========================================================
   InLog — ficheiro único (HTML + CSS + JS)
   1. Configuração   2. Utilitários   3. Camada de dados (api)
   4. Componentes    5. Vistas        6. Router e arranque
   ========================================================== */

/* ---------- 1. CONFIGURAÇÃO ----------
   Preenche as duas linhas abaixo com o URL e a chave "anon/public" do teu projeto Supabase
   (Project Settings → API Keys). A chave publishable (sb_publishable_...) é feita para ser pública;
   a segurança vem das regras RLS do ficheiro supabase.sql.
   Enquanto estiverem vazias, a app mostra um ecrã de configuração. */
const SUPABASE_URL = "https://qqsyjrjrqkmfynmaudfo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aCtA-XL_1p2DLPW05-fz7A_YK_gx7-m";
const CONFIGURED = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- 2. UTILITÁRIOS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const initials = (n = "?") => n.split(/[\s._]+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const html = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* "há 5 min", "há 2 h"... */
function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return new Date(iso).toLocaleDateString("pt-PT", { day: "numeric", month: "short" });
}

/* Reduz a imagem (máx. 1600 px, JPEG) para poupar espaço e acelerar o envio */
function resizeImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("Imagem inválida."))), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("Não foi possível ler a imagem."));
    img.src = url;
  });
}

/* Executa uma ação e mostra o erro num aviso em vez de partir a app */
async function safe(fn) { try { return await fn(); } catch (e) { toast(/row-level security/i.test(e.message || "") ? "Não tens permissão para fazer isto." : e.message || "Algo correu mal."); } }

/* ---------- 3. CAMADA DE DADOS ----------
   Toda a comunicação com o Supabase passa por este objeto `api`. */
const liveApi = {
  async me() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
  async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signUp(username, email, password) {
    // O trigger do supabase.sql cria a linha em `profiles` com este username
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    return { needsConfirm: !data.session };
  },
  async signOut() { await sb.auth.signOut(); },
  async profile(id) { const { data, error } = await sb.from("profiles").select("*").eq("id", id).single(); if (error) throw error; return data; },
  async updateProfile(id, fields, file) {
    if (file) { // imagem → Supabase Storage (bucket "avatars", pasta = id do utilizador)
      const path = `${id}/avatar`;
      const up = await sb.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
      if (up.error) throw up.error;
      fields.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
    }
    const { error } = await sb.from("profiles").update(fields).eq("id", id); if (error) throw error;
  },
  async posts(myId, userId, opts = {}) {
    let q = sb.from("posts").select("id,content,created_at,user_id,image_url,profiles!posts_user_id_fkey(username,display_name,avatar_url),likes(user_id)").order("created_at", { ascending: false }).limit(50);
    if (userId) q = q.eq("user_id", userId);
    if (opts.communityId) q = q.eq("community_id", opts.communityId); else q = q.is("community_id", null);
    if (opts.following) { // só quem eu sigo (e eu)
      const { data: f } = await sb.from("follows").select("following_id").eq("follower_id", myId);
      q = q.in("user_id", (f || []).map((x) => x.following_id).concat(myId));
    }
    const { data, error } = await q; if (error) throw error;
    return data.map((r) => ({ id: r.id, userId: r.user_id, text: r.content, image: r.image_url, time: r.created_at, name: r.profiles.display_name || r.profiles.username, username: r.profiles.username, avatar: r.profiles.avatar_url, likes: r.likes.length, liked: r.likes.some((l) => l.user_id === myId) }));
  },
  async createPost(text, file, communityId) {
    const { data: ses } = await sb.auth.getSession(); const uid = ses.session.user.id; let image_url = null;
    if (file) { // imagem → Storage (bucket "post-images", pasta = id do utilizador)
      const blob = await resizeImage(file), path = `${uid}/${Date.now()}.jpg`;
      const up = await sb.storage.from("post-images").upload(path, blob, { contentType: "image/jpeg" }); if (up.error) throw up.error;
      image_url = sb.storage.from("post-images").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from("posts").insert({ content: text, image_url, community_id: communityId || null }); if (error) throw error;
  },
  async deletePost(p) {
    const { error } = await sb.from("posts").delete().eq("id", p.id); if (error) throw error;
    if (p.image) await sb.storage.from("post-images").remove([decodeURIComponent(p.image.split("/post-images/")[1])]);
  },
  async toggleLike(post, myId) {
    const q = sb.from("likes");
    const { error } = post.liked ? await q.delete().match({ post_id: post.id, user_id: myId }) : await q.insert({ post_id: post.id });
    if (error) throw error;
  },
  async suggestions(myId) { const { data } = await sb.from("profiles").select("id,username,display_name,avatar_url").neq("id", myId).limit(3); return data || []; },

  /* ----- Perfis, seguir e amizades ----- */
  async profileByUsername(u) { const { data } = await sb.from("profiles").select("*").eq("username", u).maybeSingle(); return data; },
  async searchProfiles(q, myId) {
    const t = q.replace(/[%,()]/g, "");
    const { data, error } = await sb.from("profiles").select("id,username,display_name,avatar_url").or(`username.ilike.%${t}%,display_name.ilike.%${t}%`).neq("id", myId).limit(20);
    if (error) throw error; return data;
  },
  async isFollowing(myId, id) { const { data } = await sb.from("follows").select("follower_id").match({ follower_id: myId, following_id: id }).maybeSingle(); return !!data; },
  async follow(id) { const { error } = await sb.from("follows").insert({ following_id: id }); if (error) throw error; },
  async unfollow(myId, id) { const { error } = await sb.from("follows").delete().match({ follower_id: myId, following_id: id }); if (error) throw error; },
  async stats(id) {
    const head = { count: "exact", head: true }, c = (q) => q.then((r) => r.count || 0);
    const [posts, followers, following, friends] = await Promise.all([
      c(sb.from("posts").select("id", head).eq("user_id", id).is("community_id", null)),
      c(sb.from("follows").select("follower_id", head).eq("following_id", id)),
      c(sb.from("follows").select("follower_id", head).eq("follower_id", id)),
      c(sb.from("friendships").select("id", head).eq("status", "accepted").or(`requester_id.eq.${id},addressee_id.eq.${id}`)),
    ]);
    return { posts, followers, following, friends };
  },
  async friendship(a, b) { const { data } = await sb.from("friendships").select("*").or(`and(requester_id.eq.${a},addressee_id.eq.${b}),and(requester_id.eq.${b},addressee_id.eq.${a})`).maybeSingle(); return data; },
  async sendRequest(id) { const { error } = await sb.from("friendships").insert({ addressee_id: id }); if (error) throw error; },
  async acceptRequest(fid) { const { error } = await sb.from("friendships").update({ status: "accepted" }).eq("id", fid); if (error) throw error; },
  async deleteFriendship(fid) { const { error } = await sb.from("friendships").delete().eq("id", fid); if (error) throw error; },
  async friends(myId) {
    const P = "id,username,display_name,avatar_url";
    const { data, error } = await sb.from("friendships").select(`id,status,requester_id,addressee_id,requester:profiles!friendships_requester_id_fkey(${P}),addressee:profiles!friendships_addressee_id_fkey(${P})`).or(`requester_id.eq.${myId},addressee_id.eq.${myId}`);
    if (error) throw error;
    return data.map((r) => ({ fid: r.id, status: r.status, incoming: r.addressee_id === myId, other: r.requester_id === myId ? r.addressee : r.requester }));
  },

  /* ----- Conversas privadas e grupos ----- */
  async conversations(myId) {
    const { data, error } = await sb.from("conversation_members").select("conversations(id,type,name,last_message_at)").eq("user_id", myId);
    if (error) throw error;
    const convs = data.map((r) => r.conversations).sort((a, b) => new Date(b.last_message_at) - new Date(a.last_message_at));
    if (!convs.length) return [];
    const { data: mem } = await sb.from("conversation_members").select("conversation_id,profiles(id,username,display_name,avatar_url)").in("conversation_id", convs.map((c) => c.id));
    return convs.map((c) => ({ ...c, members: mem.filter((m) => m.conversation_id === c.id).map((m) => m.profiles) }));
  },
  async conversation(id, myId) { return (await liveApi.conversations(myId)).find((c) => String(c.id) === String(id)); },
  async startDM(other) { const { data, error } = await sb.rpc("start_dm", { other }); if (error) throw error; return data; },
  async createGroup(name, ids) { const { data, error } = await sb.rpc("create_group", { group_name: name, member_ids: ids }); if (error) throw error; return data; },
  async leaveConversation(id, myId) { const { error } = await sb.from("conversation_members").delete().match({ conversation_id: id, user_id: myId }); if (error) throw error; },
  async messages(id) { const { data, error } = await sb.from("messages").select("id,sender_id,content,created_at").eq("conversation_id", id).order("created_at").limit(200); if (error) throw error; return data; },
  async sendMessage(id, text) { const { error } = await sb.from("messages").insert({ conversation_id: id, content: text }); if (error) throw error; },

  /* ----- Comunidades ----- */
  async communities() { const { data, error } = await sb.from("communities").select("id,name,description,community_members(user_id)").order("created_at", { ascending: false }); if (error) throw error; return data; },
  async community(id) { const { data } = await sb.from("communities").select("id,name,description,community_members(user_id)").eq("id", id).maybeSingle(); return data; },
  async createCommunity(name, description) {
    const { data, error } = await sb.from("communities").insert({ name, description }).select("id").single(); if (error) throw error;
    await liveApi.joinCommunity(data.id); return data.id;
  },
  async joinCommunity(id) { const { error } = await sb.from("community_members").insert({ community_id: id }); if (error) throw error; },
  async leaveCommunity(id, myId) { const { error } = await sb.from("community_members").delete().match({ community_id: id, user_id: myId }); if (error) throw error; },
};

const api = liveApi;

/* ---------- 4. COMPONENTES ---------- */
const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8b7bff"/><path d="M10 9v14M16 9v14M22 16h-6" stroke="#12102a" stroke-width="3" stroke-linecap="round"/></svg>`;

/* Avatar: foto (Storage) ou iniciais */
function avatar(name, url, cls = "") {
  const d = html(`<div class="avatar ${cls}"></div>`);
  if (url) { const i = new Image(); i.src = url; i.alt = ""; d.appendChild(i); } else d.textContent = initials(name);
  return d;
}

/* Publicação. Texto de utilizadores entra sempre com textContent (anti-XSS) */
function postEl(p, myId) {
  const el = html(`<article class="card post"><div class="post-body">
    <div class="post-head"><b></b><span class="muted"></span></div><p class="post-text"></p><img class="post-img hidden" alt="" loading="lazy">
    <div class="actions"><button class="act like"><span class="heart">♥</span> <span class="n"></span></button><button class="act del hidden" aria-label="Apagar publicação">🗑 Apagar</button></div></div></article>`);
  el.prepend(avatar(p.name, p.avatar));
  $("b", el).textContent = p.name; $("b", el).style.cursor = "pointer"; $("b", el).onclick = () => (location.hash = "#/u/" + p.username);
  $(".muted", el).textContent = `@${p.username} · ${timeAgo(p.time)}`;
  $(".post-text", el).textContent = p.text;
  if (p.image) { const im = $(".post-img", el); im.src = p.image; im.classList.remove("hidden"); }
  // Só o autor vê o botão Apagar (a base de dados também o garante, via RLS)
  if (p.userId === myId) {
    const del = $(".del", el); del.classList.remove("hidden");
    del.addEventListener("click", async () => {
      if (!confirm("Apagar esta publicação? Não dá para desfazer.")) return;
      const ok = await safe(async () => { await api.deletePost(p); return true; });
      if (!ok) return;
      el.classList.add("removing"); toast("Publicação apagada");
      setTimeout(() => afterPublish(), 250);
    });
  }
  const btn = $(".like", el), paint = () => { btn.classList.toggle("liked", p.liked); $(".n", btn).textContent = p.likes; };
  paint();
  btn.addEventListener("click", async () => {
    const ok = await safe(async () => { await api.toggleLike(p, myId); return true; });
    if (!ok) return;
    p.liked = !p.liked; p.likes += p.liked ? 1 : -1; paint();   // atualização visual imediata
  });
  return el;
}

function headerHTML(page) {
  const a = (h, t, k) => `<a href="${h}" class="${page === k ? "active" : ""}">${t}</a>`;
  return `<header class="header"><div class="header-in">
    <a href="#/" class="logo">${LOGO}<span>InLog</span></a>
    <button class="burger" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="nav">${a("#/", "Início", "home")}${a("#/amigos", "Amigos", "amigos")}${a("#/mensagens", "Mensagens", "mensagens")}${a("#/comunidades", "Comunidades", "comunidades")}${a("#/perfil", "Perfil", "perfil")}<a href="#" id="logout">Sair</a>
    <a href="#" class="btn btn-primary" data-open-composer>Publicar</a></nav></div></header>`;
}

/* Monta uma página com header; liga menu móvel e botão Sair */
function mountPage(page, mainHTML, fab = true) {
  document.body.classList.remove("auth-mode");
  const app = $("#app"); app.innerHTML = headerHTML(page) + mainHTML + (fab ? `<button class="fab" data-open-composer aria-label="Nova publicação">+</button>` : "");
  const burger = $(".burger"), nav = $(".nav");
  burger.onclick = () => burger.setAttribute("aria-expanded", nav.classList.toggle("open"));
  $("#logout").onclick = async (e) => { e.preventDefault(); await safe(() => api.signOut()); location.hash = "#/login"; };
}

/* Diálogo de publicar: a vista atual define o que fazer depois de publicar */
let afterPublish = () => {};
let composerCommunity = null;   // preenchido quando se publica dentro de uma comunidade
(function wireComposer() {
  const dlg = $("#composer-dialog"), ta = $("textarea", dlg), fileIn = $("#p-image"), prev = $("#img-preview");
  let file = null;
  const clearImg = () => { file = null; fileIn.value = ""; prev.classList.add("hidden"); };
  ta.addEventListener("input", () => ($(".counter", dlg).textContent = `${ta.value.length}/280`));
  fileIn.addEventListener("change", () => {
    const f = fileIn.files[0]; if (!f) return;
    if (!f.type.startsWith("image/")) return toast("Escolhe um ficheiro de imagem.");
    file = f; $("img", prev).src = URL.createObjectURL(f); prev.classList.remove("hidden");
  });
  $("#img-remove").onclick = clearImg;
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-composer]")) { e.preventDefault(); $(".nav")?.classList.remove("open"); dlg.showModal(); ta.focus(); }
  });
  $("form", dlg).addEventListener("submit", async (e) => {
    if (e.submitter?.value !== "ok") return;
    const text = ta.value.trim();
    if (!text && !file) { e.preventDefault(); return toast("Escreve algo ou adiciona uma imagem."); }
    toast("A publicar…");
    const ok = await safe(async () => { await api.createPost(text, file, composerCommunity); return true; });
    if (ok) { ta.value = ""; $(".counter", dlg).textContent = "0/280"; clearImg(); toast("Publicado"); afterPublish(); }
  });
})();

async function viewFeed() {
  const me = await api.me(), prof = await api.profile(me.id);
  mountPage("home", `<main class="layout">
    <aside class="side side-left"><div class="card user-card" id="user-card"></div></aside>
    <section class="feed">
      <div class="tabs"><button class="btn btn-primary" data-t="all">Todos</button><button class="btn" data-t="following">A seguir</button></div>
      <button class="card composer" data-open-composer><span id="me-av"></span>O que estás a pensar?</button>
      <div id="feed" class="feed"></div></section>
    <aside class="side side-right"><div class="card" id="suggestions"><h3>Pessoas a seguir</h3></div></aside></main>`);

  const card = $("#user-card");
  card.append(avatar(prof.display_name || prof.username, prof.avatar_url), html("<h3></h3>"), html('<div class="muted"></div>'));
  $("h3", card).textContent = prof.display_name || prof.username; $(".muted", card).textContent = "@" + prof.username;
  $("#me-av").replaceWith(avatar(prof.display_name || prof.username, prof.avatar_url));

  let tab = "all";
  const load = async () => {
    const posts = await safe(() => api.posts(me.id, null, { following: tab === "following" })) || [], feed = $("#feed"); feed.replaceChildren();
    if (!posts.length) feed.append(html('<div class="card empty">Ainda não há publicações. Escreve a primeira!</div>'));
    posts.forEach((p) => feed.append(postEl(p, me.id)));
  };
  afterPublish = load; load();
  document.querySelectorAll(".tabs [data-t]").forEach((b) => (b.onclick = () => {
    tab = b.dataset.t; document.querySelectorAll(".tabs [data-t]").forEach((x) => x.classList.toggle("btn-primary", x === b)); load();
  }));

  const people = await api.suggestions(me.id);
  if (!people.length) $("#suggestions").classList.add("hidden");
  for (const s of people) {
    const row = html(`<div class="list-item"><div><b></b><div class="muted"></div></div><button class="btn">Seguir</button></div>`);
    row.prepend(avatar(s.display_name || s.username, s.avatar_url));
    $("b", row).textContent = s.display_name || s.username; $(".muted", row).textContent = "@" + s.username;
    $("b", row).style.cursor = "pointer"; $("b", row).onclick = () => (location.hash = "#/u/" + s.username);
    $(".btn", row).onclick = async (e) => {
      const ok = await safe(async () => { await api.follow(s.id); return true; });
      if (ok) { e.target.textContent = "A seguir ✓"; e.target.disabled = true; }
    };
    $("#suggestions").append(row);
  }
}

function authView(title, sub, fields, btn, foot) {

const field = (id, label, type = "text", ac = "") => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" type="${type}" autocomplete="${ac}" required></div>`;

function viewLogin() {
  const form = authView("Bem-vindo de volta", "Entra para ver o que há de novo.",
    field("email", "Email", "email", "email") + field("password", "Palavra-passe", "password", "current-password"),
    "Iniciar sessão", 'Ainda não tens conta? <a href="#/registo">Criar conta</a>');
  form.onsubmit = async (e) => {
    e.preventDefault();
    try { await api.signIn($("#email").value.trim(), $("#password").value); location.hash = "#/"; }
    catch (err) { $("#form-error").textContent = "Email ou palavra-passe incorretos."; }

}

function viewRegisto() {
  const form = authView("Cria a tua conta", "Leva menos de um minuto.",
    field("username", "Nome de utilizador", "text", "username") + field("email", "Email", "email", "email") +
    field("password", "Palavra-passe", "password", "new-password") + field("confirm", "Confirmar palavra-passe", "password", "new-password"),
    "Criar conta", 'Já tens conta? <a href="#/login">Iniciar sessão</a>');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const err = $("#form-error"), pw = $("#password").value, user = $("#username").value.trim();
    if (!/^[a-zA-Z0-9._]{3,20}$/.test(user)) return (err.textContent = "Utilizador: 3–20 caracteres (letras, números, . e _).");
    if (pw.length < 6) return (err.textContent = "A palavra-passe precisa de pelo menos 6 caracteres.");
    if (pw !== $("#confirm").value) return (err.textContent = "As palavras-passe não coincidem.");
    err.textContent = "";
    try {
      const r = await api.signUp(user, $("#email").value.trim(), pw);
      if (r.needsConfirm) { toast("Conta criada! Confirma o teu email para entrar."); location.hash = "#/login"; } else location.hash = "#/";
    } catch (ex) { err.textContent = ex.message; }
  };
}

async function viewPerfil() {

/* ---------- 6. ROUTER E ARRANQUE ----------
   Usamos rotas com # (ex.: #/perfil) porque o GitHub Pages só serve
   ficheiros estáticos: assim não há erros 404 ao recarregar a página. */
/* ---- Utilitários das novas vistas ---- */
/* Linha de lista (pessoa, conversa, comunidade) com ações opcionais */
function listRow(p, sub, href, actions = []) {
  const name = p.display_name || p.username || p.name;
  const el = html(`<div class="list-item"><div class="grow"><b></b><div class="muted"></div></div><div class="row-actions"></div></div>`);
  el.prepend(avatar(name, p.avatar_url));

    b.onclick = async () => { b.disabled = true; await safe(a.fn); b.disabled = false; };
    $(".row-actions", el).append(b);

  return el;
}
const note = (t) => html(`<p class="muted">${t}</p>`);

async function statsInto(el, id) {
  const st = await safe(() => api.stats(id)); if (!st || !el) return;
  const it = (n, l) => `<div><b>${n}</b> <span class="muted">${l}</span></div>`;
  el.innerHTML = it(st.posts, "publicações") + it(st.followers, "seguidores") + it(st.following, "a seguir") + it(st.friends, "amigos");
}

/* ---- Perfil de outra pessoa: seguir, amizade e mensagem ---- */
async function viewUser(username) {
  const me = await api.me(), prof = await api.profileByUsername(username);
  if (!prof) return mountPage("", '<main class="page"><div class="card empty">Utilizador não encontrado.</div></main>');
  if (prof.id === me.id) return viewPerfil();
  const name = prof.display_name || prof.username;
  mountPage("", `<main class="profile"><div class="cover"></div>
    <div class="profile-head"><span id="p-av"></span><div class="row-actions" id="p-actions"></div></div>
    <div class="profile-info"><h1 id="p-name"></h1><div class="muted" id="p-user"></div><p id="p-bio"></p><div class="profile-stats" id="p-stats"></div></div>
    <div id="p-posts" class="feed"></div></main>`);
  $("#p-av").append(avatar(name, prof.avatar_url, "lg"));
  $("#p-name").textContent = name; $("#p-user").textContent = "@" + prof.username; $("#p-bio").textContent = prof.bio || "";

  const paint = async () => {
    const [following, fr] = await Promise.all([api.isFollowing(me.id, prof.id), api.friendship(me.id, prof.id)]);
    const acts = $("#p-actions"); if (!acts) return; acts.replaceChildren();
    const add = (label, fn, primary) => {
      const b = html(`<button class="btn${primary ? " btn-primary" : ""}"></button>`); b.textContent = label;
      b.onclick = async () => { b.disabled = true; await safe(fn); paint(); }; acts.append(b);
    };
    add(following ? "A seguir ✓" : "Seguir", () => (following ? api.unfollow(me.id, prof.id) : api.follow(prof.id)), !following);
    if (!fr) add("Adicionar amigo", () => api.sendRequest(prof.id));
    else if (fr.status === "pending") {
      if (fr.requester_id === me.id) add("Pedido enviado ✕", () => api.deleteFriendship(fr.id));
      else add("Aceitar pedido", () => api.acceptRequest(fr.id), true);
    } else {
      add("Mensagem", async () => { location.hash = "#/chat/" + (await api.startDM(prof.id)); }, true);
      add("Amigos ✓", async () => { if (confirm("Remover dos amigos?")) await api.deleteFriendship(fr.id); });
    }
    statsInto($("#p-stats"), prof.id);
  };
  paint();
  const posts = await safe(() => api.posts(me.id, prof.id)) || [], list = $("#p-posts");
  if (!posts.length) list.append(html('<div class="card empty">Ainda não há publicações.</div>'));
  posts.forEach((p) => list.append(postEl(p, me.id)));
}

    $("#reqs").replaceChildren(...reqs.map((r) => listRow(r.other, "@" + r.other.username, "#/u/" + r.other.username, [
      { label: "Aceitar", primary: true, fn: async () => { await api.acceptRequest(r.fid); load(); } },
      { label: "Recusar", fn: async () => { await api.deleteFriendship(r.fid); load(); } }])));
    $("#friends").replaceChildren(...(fr.length ? fr.map((r) => listRow(r.other, "@" + r.other.username, "#/u/" + r.other.username, [
      { label: "Mensagem", primary: true, fn: async () => { location.hash = "#/chat/" + (await api.startDM(r.other.id)); } }])) : [note("Ainda não tens amigos. Procura pessoas acima!")]));
  };
  load();
  let t;
  $("#q").oninput = (e) => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = e.target.value.trim(), box = $("#results");
      if (q.length < 2) return box.replaceChildren();
      const res = await safe(() => api.searchProfiles(q, me.id)) || [];
      box.replaceChildren(...(res.length ? res.map((p) => listRow(p, "@" + p.username, "#/u/" + p.username)) : [note("Ninguém encontrado.")]));
    }, 300);
  };
}

/* ---- Mensagens: lista de conversas e criação de grupos ---- */
const convTitle = (c, myId) => (c.type === "group" ? c.name : (c.members.find((m) => m.id !== myId) || {}).display_name || (c.members.find((m) => m.id !== myId) || {}).username || "Conversa");

async function viewMensagens() {
  const me = await api.me();
  mountPage("mensagens", `<main class="page"><div class="ptitle-row"><h2 class="ptitle">Mensagens</h2><button class="btn btn-primary" id="new-group">Novo grupo</button></div><div class="card" id="convs"></div></main>`);
  const convs = await safe(() => api.conversations(me.id)) || [];
  $("#convs").replaceChildren(...(convs.length ? convs.map((c) => {
    const other = c.type === "dm" ? c.members.find((m) => m.id !== me.id) || {} : {};
    return listRow({ name: convTitle(c, me.id), avatar_url: other.avatar_url }, c.type === "group" ? `Grupo · ${c.members.length} membros` : "Conversa privada", "#/chat/" + c.id);
  }) : [note('Sem conversas ainda. Abre a página <a href="#/amigos" style="color:var(--accent)">Amigos</a> e envia uma mensagem a alguém.')]));

  $("#new-group").onclick = async () => {
    const fr = (await safe(() => api.friends(me.id)) || []).filter((r) => r.status === "accepted");
    if (!fr.length) return toast("Precisas de amigos para criar um grupo.");
    $("#g-members").replaceChildren(...fr.map((r) => {
      const l = html('<label class="check"><input type="checkbox"><span></span></label>');
      $("input", l).value = r.other.id; $("span", l).textContent = r.other.display_name || r.other.username; return l;
    }));
    $("#g-name").value = ""; $("#group-dialog").showModal();
  };
  $("#group-dialog form").onsubmit = async (e) => {
    if (e.submitter?.value !== "ok") return;
    const gname = $("#g-name").value.trim(), ids = [...document.querySelectorAll("#g-members input:checked")].map((i) => i.value);
    if (!gname || !ids.length) { e.preventDefault(); return toast("Dá um nome e escolhe pelo menos um amigo."); }
    const id = await safe(() => api.createGroup(gname, ids)); if (id) location.hash = "#/chat/" + id;
  };
}

/* ---- Conversa (privada ou grupo) com mensagens em tempo real ---- */
let chatChannel = null;
function stopChat() { if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; } }

async function viewChat(id) {
  const me = await api.me(), conv = await api.conversation(id, me.id);
  if (!conv) return mountPage("mensagens", '<main class="page"><div class="card empty">Conversa não encontrada.</div></main>', false);
  const who = Object.fromEntries(conv.members.map((m) => [m.id, m]));
  mountPage("mensagens", `<main class="chat"><div class="chat-head"><a href="#/mensagens" class="btn">←</a><b id="c-title"></b><button class="btn hidden" id="leave">Sair do grupo</button></div>
    <div class="msgs" id="msgs"></div>
    <form class="chat-form" id="chat-form"><input class="input" id="c-text" maxlength="1000" placeholder="Escreve uma mensagem…" autocomplete="off"><button class="btn btn-primary">Enviar</button></form></main>`, false);
  $("#c-title").textContent = convTitle(conv, me.id);
  if (conv.type === "group") {
    $("#leave").classList.remove("hidden");
    $("#leave").onclick = async () => { if (confirm("Sair deste grupo?")) { await safe(() => api.leaveConversation(id, me.id)); location.hash = "#/mensagens"; } };
  }
  const box = $("#msgs"), seen = new Set();
  const add = (m) => {
    if (seen.has(m.id)) return; seen.add(m.id);
    const mine = m.sender_id === me.id, el = html('<div class="msg"><small></small><span></span></div>');
    if (mine) el.classList.add("me");
    if (mine || conv.type !== "group") $("small", el).remove(); else $("small", el).textContent = (who[m.sender_id] || {}).display_name || "Ex-membro";
    $("span", el).textContent = m.content; box.append(el); box.scrollTop = box.scrollHeight;
  };
  const sync = async () => ((await safe(() => api.messages(id))) || []).forEach(add);
  await sync();
  // Tempo real: novas mensagens aparecem sem recarregar
  chatChannel = sb.channel("chat-" + id).on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `conversation_id=eq.${id}` }, (pl) => add(pl.new)).subscribe();
  $("#chat-form").onsubmit = async (e) => {
    e.preventDefault();
    const inp = $("#c-text"), text = inp.value.trim(); if (!text) return;
    inp.value = ""; await safe(() => api.sendMessage(id, text)); setTimeout(sync, 700);   // plano B se o tempo real falhar
  };
}

/* ---- Comunidades ---- */
async function viewComunidades() {
  const me = await api.me();
  mountPage("comunidades", `<main class="page"><div class="ptitle-row"><h2 class="ptitle">Comunidades</h2><button class="btn btn-primary" id="new-comm">Criar</button></div><div class="card" id="comms"></div></main>`);
  const load = async () => {
    const list = await safe(() => api.communities()) || [];
    $("#comms").replaceChildren(...(list.length ? list.map((c) => {
      const joined = c.community_members.some((m) => m.user_id === me.id);
      return listRow({ name: c.name }, `${c.community_members.length} membros${c.description ? " · " + c.description : ""}`, "#/c/" + c.id, [
        { label: joined ? "Sair" : "Entrar", primary: !joined, fn: async () => { await (joined ? api.leaveCommunity(c.id, me.id) : api.joinCommunity(c.id)); load(); } }]);
    }) : [note("Ainda não há comunidades. Cria a primeira!")]));
  };
  load();
  $("#new-comm").onclick = () => { $("#cm-name").value = ""; $("#cm-desc").value = ""; $("#comm-dialog").showModal(); };
  $("#comm-dialog form").onsubmit = async (e) => {
    if (e.submitter?.value !== "ok") return;
    const cname = $("#cm-name").value.trim();
    if (cname.length < 2) { e.preventDefault(); return toast("Dá um nome à comunidade."); }
    const id = await safe(() => api.createCommunity(cname, $("#cm-desc").value.trim())); if (id) location.hash = "#/c/" + id;
  };
}

async function viewComunidade(id) {
  const me = await api.me();
  if (!(await api.community(id))) return mountPage("comunidades", '<main class="page"><div class="card empty">Comunidade não encontrada.</div></main>');
  composerCommunity = Number(id);   // o botão Publicar passa a publicar aqui dentro
  mountPage("comunidades", `<main class="page"><div class="card"><h2 id="c-name"></h2><p class="muted" id="c-desc"></p><div class="row-actions" id="c-actions" style="margin:0"></div></div><div id="c-feed" class="feed"></div></main>`);
  const paint = async () => {
    const c = await api.community(id), joined = c.community_members.some((m) => m.user_id === me.id);
    $("#c-name").textContent = c.name; $("#c-desc").textContent = `${c.community_members.length} membros${c.description ? " · " + c.description : ""}`;
    const acts = $("#c-actions"); acts.replaceChildren();
    const b = html(`<button class="btn${joined ? "" : " btn-primary"}"></button>`); b.textContent = joined ? "Sair da comunidade" : "Entrar";
    b.onclick = async () => { await safe(() => (joined ? api.leaveCommunity(c.id, me.id) : api.joinCommunity(c.id))); paint(); }; acts.append(b);
    if (joined) acts.append(html('<button class="btn btn-primary" data-open-composer>Publicar aqui</button>'));
    const posts = await safe(() => api.posts(me.id, null, { communityId: c.id })) || [], feed = $("#c-feed"); feed.replaceChildren();
    if (!posts.length) feed.append(html('<div class="card empty">Ainda não há publicações nesta comunidade.</div>'));
    posts.forEach((p) => feed.append(postEl(p, me.id)));
  };
  afterPublish = paint; paint();
}

/* ---------- 6. ROUTER E ARRANQUE ----------
   Rotas com # (ex.: #/u/maria) porque o GitHub Pages só serve ficheiros estáticos. */
const routes = { "/": viewFeed, "/login": viewLogin, "/registo": viewRegisto, "/perfil": viewPerfil, "/amigos": viewAmigos, "/mensagens": viewMensagens,
  "/chat": viewChat, "/comunidades": viewComunidades, "/c": viewComunidade, "/u": viewUser };
const PUBLIC = ["/login", "/registo"];

/* Mostra instruções se o Supabase ainda não estiver configurado */
function viewSetup() {
  document.body.classList.add("auth-mode");
  $("#app").innerHTML = `<main class="card auth-card"><a href="#/" class="logo">${LOGO}<span>InLog</span></a>
    <h1>Falta ligar o Supabase</h1>
    <p class="sub muted">Abre o <b>index.html</b> e preenche <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no início do script.</p></main>`;
}

async function router() {
  if (!CONFIGURED) return viewSetup();
  stopChat();
  const path = location.hash.slice(1) || "/";
  const [, root = "", arg = ""] = path.match(/^\/([^/]*)(?:\/(.+))?$/) || [];
  const key = "/" + root, user = await api.me(), isPublic = PUBLIC.includes(key);
  if (!user && !isPublic) return (location.hash = "#/login");   // exige sessão
  if (user && isPublic) return (location.hash = "#/");
  composerCommunity = null; window.scrollTo(0, 0);
  await safe(() => (routes[key] || viewFeed)(decodeURIComponent(arg)));
}
window.addEventListener("hashchange", router);
if (CONFIGURED) sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") router(); });
router();
</script>
